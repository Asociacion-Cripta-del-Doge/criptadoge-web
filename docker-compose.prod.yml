services:
  front:
    build:
      context: ./frontCripta
      target: prod
      args:
        VITE_API_URL: ${VITE_API_URL:?define VITE_API_URL in .env.production}
    container_name: criptaDoge-front-prod
    restart: always
    expose:
      - "80"

  back:
    build:
      context: ./backCripta
      target: prod
    container_name: criptaDoge-back-prod
    restart: always
    env_file:
      - ./.env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MONGO_URL: mongodb://mongo:27017/cripta-db
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
    expose:
      - "3000"
    command: sh -c "until yarn prisma migrate deploy; do echo 'PostgreSQL no esta listo, reintentando migraciones en 5s...'; sleep 5; done; yarn seed:prod && yarn start:prod"

  db:
    image: postgres:17-alpine
    container_name: criptaDoge-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 180s
    volumes:
      - db_prod_data:/var/lib/postgresql/data

  mongo:
    image: mongo:8
    container_name: criptaDoge-mongo-prod
    restart: always
    expose:
      - "27017"
    volumes:
      - mongo_prod_data:/data/db

  nginx:
    image: nginx:1.27-alpine
    container_name: criptaDoge-nginx-prod
    restart: always
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?define NGINX_SERVER_NAME in .env.production}
      TLS_CERTIFICATE: ${TLS_CERTIFICATE:?define TLS_CERTIFICATE in .env.production}
      TLS_CERTIFICATE_KEY: ${TLS_CERTIFICATE_KEY:?define TLS_CERTIFICATE_KEY in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/templates/default.conf.template:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - front
      - back

  certbot:
    image: certbot/certbot:latest
    profiles:
      - certbot
    ports:
      - "80:80"
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  db_prod_data:
  mongo_prod_data:
