name: Frontend CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontCripta/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontCripta
        run: npm ci

      - name: Compilar (TypeScript + Vite)
        working-directory: ./frontCripta
        run: npm run build
