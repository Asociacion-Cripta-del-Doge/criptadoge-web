services:  
  front:  
    build: ./frontCripta  
    container_name: criptaDoge-front 
    restart: always
    volumes:  
      - ./frontCripta:/app    
    expose:  
      - "5173" 
    env_file:
      - ./.env
    command: sh -c "npm install && npm run dev"
  
  back:  
    build: ./backCripta
    container_name: criptaDoge-back 
    restart: always
    volumes:  
      - ./backCripta:/app    
    environment:  
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}  
      MONGO_URI: mongodb://mongo:27017/criptaDoge  
    depends_on:  
      - db  
      - mongo  
    expose:  
      - "3000"  
    env_file:
      - ./.env
    command: sh -c "yarn install --immutable && yarn start:dev"
  
  db:  
    image: postgres:17-alpine  
    container_name: criptaDoge-db  
    restart: always  
    environment:  
      POSTGRES_USER: ${POSTGRES_USER}  
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  
      POSTGRES_DB: ${POSTGRES_DB}  
    ports:  
      - ${POSTGRES_PORT}:${POSTGRES_PORT}  
    volumes:  
      - db_data:/var/lib/postgresql/data  
  
  mongo:  
    image: mongo:8
    container_name: criptaDoge-mongo  
    restart: always  
    ports:  
      - "27017:27017"  
    volumes:  
      - mongo_data:/data/db  
  
  nginx:  
    image: nginx:alpine
    container_name: criptaDoge-nginx 
    restart: always 
    ports:  
      - "8080:80"  
    volumes:  
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro  
    depends_on:  
      - front  
      - back  
  
volumes:  
  db_data:  
  mongo_data:
