services:
  front:
    build: ./frontCripta
    container_name: criptaDoge-front
    restart: always
    volumes:
      - ./frontCripta:/app
    expose:
      - "5173"
    env_file:
      - ./.env
    command: sh -c "npm install && npm run dev"

  back:
    build: ./backCripta
    container_name: criptaDoge-back
    restart: always
    volumes:
      - ./backCripta:/app
    environment:
      MONGO_URL: mongodb://mongo:27017/cripta-db
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    command: sh -c "yarn install --immutable && yarn prisma generate && yarn prisma migrate deploy && yarn seed && yarn start:dev"

  db:
    image: postgres:17-alpine
    container_name: criptaDoge-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /tmp/postgres-data
    ports:
      - ${POSTGRES_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - type: tmpfs
        target: /tmp/postgres-data

  mongo:
    image: mongo:8
    container_name: criptaDoge-mongo
    restart: always
    command: ["mongod", "--dbpath", "/tmp/mongo-data"]
    ports:
      - "27017:27017"
    volumes:
      - type: tmpfs
        target: /tmp/mongo-data

  nginx:
    image: nginx:latest
    container_name: criptaDoge-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - front
      - back

