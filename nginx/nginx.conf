user nginx;  
worker_processes auto;  
  
error_log /var/log/nginx/error.log warn;  
pid /var/run/nginx.pid;  
  
events {  
    worker_connections 1024;  
}  
  
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        # Cabeceras de seguridad HTTP
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; 
                                            style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 
                                            'none';" always;

        # Frontend (Vite dev server o estáticos)
        location / {
            proxy_pass http://front:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth endpoints con rate limiting (5 req/min por IP)
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://back:3000/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend (NestJS)
        location /api/ {
            proxy_pass http://back:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    
        # Bloquea archivos sensibles (Si intentas acceder a un archivo .env, .htaccess, o la carpeta .git te salta un error 403)
        location ~* ^.+\.(env|git|htaccess)$ { 
            deny all;
        }

        location /.git/ {
            deny all;
        }
    }
}

user nginx;  
worker_processes auto;  
  
error_log /var/log/nginx/error.log warn;  
pid /var/run/nginx.pid;  
  
events {  
    worker_connections 1024;  
}  
  
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        # ── CABECERAS DE SEGURIDAD HTTP ───────────────────────────────────────
        #
        # Nota: HSTS (Strict-Transport-Security) se omite aquí porque este
        # servidor escucha en HTTP puro (puerto 80). HSTS solo tiene sentido
        # en bloques server con TLS (listen 443 ssl). Si en el futuro añades
        # HTTPS, agrega:
        #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        #
        # ── X-Frame-Options ──────────────────────────────────────────────────
        # Impide que la web se cargue dentro de un <iframe> en otro dominio.
        # Protege contra Clickjacking: el atacante superpone un iframe invisible
        # con tu web para que el usuario haga clic sin saberlo (ej. confirmar pagos).
        # SAMEORIGIN = solo se permiten iframes dentro del propio dominio.
        add_header X-Frame-Options "SAMEORIGIN" always;

        # ── X-Content-Type-Options ────────────────────────────────────────────
        # Evita que el navegador "adivine" el tipo MIME de un fichero cuando
        # el servidor no lo especifica correctamente.
        # Sin esta cabecera, un atacante podría subir un .jpg que en realidad
        # contiene JavaScript y el navegador lo ejecutaría (MIME sniffing attack).
        add_header X-Content-Type-Options "nosniff" always;

        # ── Referrer-Policy ───────────────────────────────────────────────────
        # Controla qué información de la URL de origen se envía a otros sitios
        # cuando el usuario hace clic en un enlace externo.
        # strict-origin-when-cross-origin: a dominios externos solo se envía
        # el dominio (nunca la ruta ni los query params). Evita filtrar rutas
        # internas o tokens incluidos en la URL.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── Permissions-Policy ────────────────────────────────────────────────
        # Deshabilita APIs del navegador que la app no necesita.
        # Si alguien inyecta código malicioso en la página, no podrá activar
        # la cámara, el micrófono ni la geolocalización del usuario.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Content-Security-Policy ───────────────────────────────────────────
        # La más potente de las cabeceras de seguridad. Define exactamente
        # desde qué orígenes puede la página cargar scripts, estilos, imágenes,
        # etc. Si se inyecta un <script src="evil.com/xss.js">, el navegador
        # lo bloquea porque ese origen no está en la lista blanca.
        # Protege principalmente contra XSS (Cross-Site Scripting).
        #
        # default-src 'self'       → por defecto, solo recursos del propio dominio
        # script-src 'unsafe-inline' → necesario para el bundle de React/Vite
        # style-src 'unsafe-inline'  → necesario para estilos en línea del build
        # img-src data:            → permite imágenes en base64 (avatares, iconos)
        # connect-src 'self'       → fetch/XHR solo hacia el propio origen (API via Nginx)
        # frame-ancestors 'none'   → equivalente moderno a X-Frame-Options (doble protección)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none';" always;

        # ─────────────────────────────────────────────────────────────────────

        # Frontend (Vite dev server o estáticos)
        location / {
            proxy_pass http://front:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth endpoints con rate limiting (5 req/min por IP)
        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://back:3000/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Backend (NestJS)
        location /api/ {
            proxy_pass http://back:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}